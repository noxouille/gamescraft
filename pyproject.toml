[project]
name = "gamescraft"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru",
    "openai>=1.0.0",
    "together>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.6.6",
    "langchain>=0.3.27",
    "langchain-openai>=0.3.30",
    "langchain-community>=0.3.27",
    "youtube-transcript-api>=1.2.2",
    "beautifulsoup4>=4.13.4",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils", "agents", "tools", "workflows", "llm_client"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
